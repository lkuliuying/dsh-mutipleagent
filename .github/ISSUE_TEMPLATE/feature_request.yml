name: 功能建议
description: 想加的能力、想改的交互
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        这个插件是**只读观察器**：不启动任务、不调用模型、不写会话。涉及"替我操作 Agent"的建议通常不会实现，但"看得更清楚"的建议很欢迎。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是先给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过或考虑过的替代方案（可选）
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 这个建议不需要插件启动、暂停、审批任务或调用模型
          required: true
        - label: 这个建议不需要读取会话文件路径或凭据
          required: true

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要重建的 tag（例如 v0.2.0）
        required: true

permissions:
  contents: write
  # npm publish --provenance 需要 OIDC 令牌；未配置 NPM_TOKEN 时这一步会跳过。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: 版本与 tag 一致
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag 与 package.json $version 不一致"
            exit 1
          fi
      - run: npm test
      - name: 生成发布说明
        run: node scripts/release-notes.mjs > /tmp/notes.md
      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::未配置 NPM_TOKEN，跳过 npm 发布"
            exit 0
          fi
          npm publish --access public --provenance
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 && gh release edit "$tag" --notes-file /tmp/notes.md || gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
